
<form action="" class="">
    <div class="field">
        <div class="sub-field">
            <label class="label">Titulo</label>
            <button (click)="closeTask()" ><i class="fa-solid fa-circle-xmark"></i></button>         
        </div>
        <div class="control">
        <input class="input" type="text" placeholder="Text input">
        </div>
    </div>   
    
    <div class="field">
        <p class="help lab">Cor da tarefa</p>
        <input class="color" type="color">
       
    </div>
    <div class="field">
        <label for="" class="data-start">Começa:  </label>
        <input class="date" type="datetime-local">
    </div>
    <div class="field">
        <label for="" class="data-end">Termina:  </label>
        <input class="date" type="datetime-local">
    </div>
    <div class="field">
        <label class="checkbox">
            <input type="checkbox" />
            Dia todo
        </label>
    </div>
    <div class="field">
        <p class="help lab">Repeticao da tarefa</p>
        <div class="select">
            <select>
            <option>---</option>  
            <option>Nunca</option>
            <option>Todas as semanas</option>
            </select>
        </div>
    </div>

    <div class="field">
        <label class="checkbox">
            <input type="checkbox" />
            Enviar alerta por email
        </label>
    </div>

    <div class="field btn">
        <button (click)="newTaskDay()"  style="background-color: #3D3D3D; color: #fff; width: 150px; font-size: 1em;" class="button is-success">
            Salvar
        </button>
    </div>
</form>
